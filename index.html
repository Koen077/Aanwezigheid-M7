<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aanwezigheid voetbalteam</title>
<style>
  :root {
    --border: #ddd;
    --border-strong: #bbb;
    --text-secondary: #666;
    --text-muted: #999;
    --surface-1: #f7f7f7;
    --surface-2: #ffffff;
    --accent: #1d6f42;
    --accent-bg: #e6f4ea;
    --danger: #b3261e;
    --danger-bg: #fbeaea;
    --amber: #8a5a00;
    --amber-bg: #fdf1dc;
    --blue: #0c447c;
    --blue-bg: #e6f1fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --border: #3a3a3a;
      --border-strong: #555;
      --text-secondary: #b5b5b5;
      --text-muted: #888;
      --surface-1: #1e1e1e;
      --surface-2: #141414;
      --accent: #5dcaa5;
      --accent-bg: #0f3327;
      --danger: #f09595;
      --danger-bg: #3a1717;
      --amber: #efc27a;
      --amber-bg: #3a2b0d;
      --blue: #85b7eb;
      --blue-bg: #0c2a45;
    }
    body { background: #0b0b0b; color: #eee; }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) { body { color: #eee; } }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--text-secondary); font-size: 14px; margin: 0 0 20px; }
  .deadline {
    display: flex; align-items: center; gap: 8px;
    background: var(--amber-bg); color: var(--amber);
    border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 20px;
  }
  .card {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
  select {
    width: 100%; height: 40px; border-radius: 8px; border: 1px solid var(--border-strong);
    background: var(--surface-2); color: inherit; font-size: 15px; padding: 0 10px; margin-bottom: 4px;
  }
  .status-options { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .status-option {
    display: flex; align-items: center; gap: 10px; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; cursor: pointer; font-size: 14px;
  }
  .status-option:hover { border-color: var(--border-strong); }
  .status-option input { margin: 0; }
  .status-option.selected { border-color: var(--accent); background: var(--accent-bg); }
  button {
    width: 100%; height: 42px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-top: 14px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); margin-top: 8px; }
  .error { color: var(--danger); font-size: 13px; margin-top: 6px; }
  .confirm {
    display: flex; align-items: center; gap: 10px;
    background: var(--accent-bg); color: var(--accent);
    border-radius: 8px; padding: 12px 14px; font-size: 14px; margin-bottom: 10px;
  }
  h2 { font-size: 16px; font-weight: 600; margin: 24px 0 10px; }
  .group { margin-bottom: 14px; }
  .group-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.play { background: var(--accent); }
  .dot.watch { background: var(--blue); }
  .dot.away { background: var(--danger); }
  .dot.later { background: var(--amber); }
  .name-pill {
    display: inline-block; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 10px; font-size: 13px; margin: 3px 4px 0 0;
  }
  .empty { color: var(--text-muted); font-size: 13px; }
  .refresh-row { display: flex; justify-content: space-between; align-items: center; }
  .refresh-row button { width: auto; height: 32px; padding: 0 12px; font-size: 13px; margin-top: 0; }
  .count { color: var(--text-muted); font-size: 12px; }
  .loading { color: var(--text-muted); font-size: 14px; padding: 20px 0; text-align: center; }

  .admin-trigger { text-align: center; margin-top: 30px; }
  .admin-link {
    width: auto; background: transparent; color: var(--text-muted); border: none;
    font-size: 12px; text-decoration: underline; cursor: pointer; height: auto; padding: 4px; margin-top: 0;
  }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  .overlay.hidden { display: none; }
  .overlay-card {
    background: var(--surface-2); border-radius: 14px; padding: 24px;
    width: 100%; max-width: 360px; max-height: 85vh; overflow-y: auto;
  }
  .pin-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 6px; }
  .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border-strong); }
  .pin-dot.filled { background: var(--accent); border-color: var(--accent); }
  .pin-error { color: var(--danger); font-size: 13px; text-align: center; min-height: 18px; margin-bottom: 8px; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .keypad button {
    height: 56px; font-size: 18px; border-radius: 10px; border: 1px solid var(--border-strong);
    background: var(--surface-1); color: inherit; margin-top: 0;
  }
  .admin-card h3 { font-size: 14px; margin: 0 0 8px; }
  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .close-btn { width: auto; height: 32px; padding: 0 10px; background: transparent; border: 1px solid var(--border-strong); color: inherit; margin-top: 0; }
  .admin-names-list { max-height: 180px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 6px; }
  .admin-name-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; font-size: 14px; }
  .admin-name-row button { width: auto; height: 26px; padding: 0 8px; font-size: 12px; background: var(--danger-bg); color: var(--danger); border: none; margin-top: 0; border-radius: 6px; }
  .admin-add-row { display: flex; gap: 8px; margin-top: 8px; }
  .admin-add-row input { flex: 1; height: 38px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-2); color: inherit; padding: 0 10px; }
  .admin-add-row button { width: auto; padding: 0 14px; margin-top: 0; }
  .admin-row { display: flex; gap: 8px; }
  .admin-row select { flex: 1; height: 38px; margin-bottom: 0; }
  .danger-btn { background: var(--danger); }
</style>
</head>
<body>

<h1>Aanwezigheid voetbalteam</h1>
<p class="sub">Kies je naam en geef aan of je aanwezig bent.</p>
<div class="deadline" id="deadlineBox"></div>

<div id="app"><div class="loading">Laden...</div></div>

<h2>Overzicht deze week</h2>
<div class="card">
  <div class="refresh-row">
    <span class="count" id="responseCount"></span>
    <button class="secondary" onclick="refreshOverview()" style="border:1px solid var(--border-strong); color:inherit;">Vernieuwen</button>
  </div>
  <div id="overview" style="margin-top:12px;"></div>
</div>

<div class="admin-trigger">
  <button class="admin-link" onclick="openAdminPin()">Beheer</button>
</div>

<div id="adminPinOverlay" class="overlay hidden">
  <div class="overlay-card">
    <h2 style="margin-top:0;">Beheercode</h2>
    <p class="sub" style="margin-bottom:16px;">Voer de 4-cijferige code in.</p>
    <div class="pin-dots" id="pinDots">
      <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
    </div>
    <div class="pin-error" id="pinError"></div>
    <div class="keypad">
      <button onclick="pinPress('1')">1</button>
      <button onclick="pinPress('2')">2</button>
      <button onclick="pinPress('3')">3</button>
      <button onclick="pinPress('4')">4</button>
      <button onclick="pinPress('5')">5</button>
      <button onclick="pinPress('6')">6</button>
      <button onclick="pinPress('7')">7</button>
      <button onclick="pinPress('8')">8</button>
      <button onclick="pinPress('9')">9</button>
      <button onclick="pinBackspace()">⌫</button>
      <button onclick="pinPress('0')">0</button>
      <button onclick="closeAdminPin()">✕</button>
    </div>
  </div>
</div>

<div id="adminPanelOverlay" class="overlay hidden">
  <div class="overlay-card admin-card">
    <div class="admin-header">
      <h2 style="margin:0;">Beheer</h2>
      <button class="close-btn" onclick="closeAdminPanel()">✕</button>
    </div>

    <h3>Namen</h3>
    <div id="adminNamesList" class="admin-names-list"></div>
    <div class="admin-add-row">
      <input type="text" id="newNameInput" placeholder="Nieuwe naam">
      <button onclick="addName()">Toevoegen</button>
    </div>

    <h3 style="margin-top:24px;">Deadline</h3>
    <div class="admin-row">
      <select id="deadlineWeekdaySelect"></select>
      <select id="deadlineHourSelect"></select>
    </div>

    <h3 style="margin-top:20px;">Reset</h3>
    <div class="admin-row">
      <select id="resetWeekdaySelect"></select>
      <select id="resetHourSelect"></select>
    </div>

    <button onclick="saveAdminSettings()" style="margin-top:20px;">Instellingen opslaan</button>

    <h3 style="margin-top:24px;">Huidige week</h3>
    <button class="danger-btn" onclick="resetCurrentWeek()">Reset deze week nu</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAXzLia3yhaUhORx3NR7mgnfg3KIc3VPt8",
  authDomain: "aanwezigheid-m7.firebaseapp.com",
  databaseURL: "https://aanwezigheid-m7-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "aanwezigheid-m7",
  storageBucket: "aanwezigheid-m7.firebasestorage.app",
  messagingSenderId: "220188713663",
  appId: "1:220188713663:web:efb565653f3a02473c9c0a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const DEFAULT_NAMES = [
  "Aaron","Bjorn","Bram","Collin","Dain","Dylan","Jens","Jesly","Job","Joost",
  "Joris","Jurn","Koen","Lucas","Luuk","Niels","Raf","Ruud","Scott","Sepp",
  "Servaas","Sil","Sjoerd","Stan van de Groes","Stan van Dijck","Sven Obbing",
  "Thijs Janssen","Thijs van Grimbergen","Tim","Timo","Tuur","Tycho","Wouter"
];

const STATUS_OPTIONS = [
  { id: "play", label: "Aanwezig voetballen", dot: "play" },
  { id: "watch", label: "Aanwezig kijken", dot: "watch" },
  { id: "away", label: "Afwezig", dot: "away" },
  { id: "later", label: "Later", dot: "later" }
];

const WEEKDAY_ORDER = ["zon","maa","din","woe","don","vri","zat"];
const WEEKDAY_FULL = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const ADMIN_PIN = "0307";
const PERSONAL_KEY = "my-selection";

const DEFAULT_CONFIG = {
  deadlineWeekday: 4, // donderdag
  deadlineHour: 15,
  resetWeekday: 1, // maandag
  resetHour: 12,
  names: DEFAULT_NAMES
};

let CONFIG = null;
let ALL_NAMES = [];
let WEEK = null;
let PAST_DEADLINE = false;
let selectedName = null;
let selectedStatus = null;
let mySubmission = null;
let enteredPin = "";
let pendingNames = [];

function getAmsterdamParts() {
  const fmt = new Intl.DateTimeFormat("nl-NL", {
    timeZone: "Europe/Amsterdam", weekday: "short", year: "numeric",
    month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false
  });
  const parts = {};
  fmt.formatToParts(new Date()).forEach(p => { parts[p.type] = p.value; });
  const weekdayIdx = WEEKDAY_ORDER.findIndex(w => parts.weekday.toLowerCase().startsWith(w));
  return {
    weekdayIdx,
    year: parseInt(parts.year, 10),
    month: parseInt(parts.month, 10),
    day: parseInt(parts.day, 10),
    hour: parseInt(parts.hour, 10) === 24 ? 0 : parseInt(parts.hour, 10),
    minute: parseInt(parts.minute, 10)
  };
}

function computeCycle(config) {
  const now = getAmsterdamParts();
  let daysSinceReset = (now.weekdayIdx - config.resetWeekday + 7) % 7;
  if (daysSinceReset === 0 && now.hour < config.resetHour) {
    daysSinceReset = 7;
  }
  const base = new Date(Date.UTC(now.year, now.month - 1, now.day));
  base.setUTCDate(base.getUTCDate() - daysSinceReset);
  const y = base.getUTCFullYear();
  const m = String(base.getUTCMonth() + 1).padStart(2, "0");
  const d = String(base.getUTCDate()).padStart(2, "0");

  const deadlineOffsetDays = (config.deadlineWeekday - config.resetWeekday + 7) % 7;
  const deadlineDate = new Date(base);
  deadlineDate.setUTCDate(deadlineDate.getUTCDate() + deadlineOffsetDays);

  const resetDate = new Date(base);
  resetDate.setUTCDate(resetDate.getUTCDate() + 7);

  let pastDeadline;
  if (daysSinceReset > deadlineOffsetDays) pastDeadline = true;
  else if (daysSinceReset === deadlineOffsetDays) pastDeadline = now.hour >= config.deadlineHour;
  else pastDeadline = false;

  return { key: `${y}-${m}-${d}`, deadlineDate, resetDate, pastDeadline };
}

function fmtMoment(d, weekdayIdx, hour) {
  return `${WEEKDAY_FULL[weekdayIdx]} ${d.getUTCDate()}/${d.getUTCMonth()+1} om ${String(hour).padStart(2,"0")}:00 uur`;
}

async function loadConfig() {
  try {
    const snap = await db.ref("config").get();
    if (snap.exists()) {
      return { ...DEFAULT_CONFIG, ...snap.val() };
    }
    await db.ref("config").set(DEFAULT_CONFIG);
    return { ...DEFAULT_CONFIG };
  } catch (e) {
    return { ...DEFAULT_CONFIG };
  }
}

async function saveConfig(config) {
  await db.ref("config").set(config);
}

async function loadSharedSignups() {
  try {
    const snap = await db.ref(`signups/${WEEK.key}`).get();
    return snap.exists() ? snap.val() : {};
  } catch (e) {
    return {};
  }
}

async function saveSharedSignups(data) {
  await db.ref(`signups/${WEEK.key}`).set(data);
}

function loadMySubmission() {
  try {
    const raw = localStorage.getItem(PERSONAL_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed.week !== WEEK.key) return null;
    return parsed;
  } catch (e) {
    return null;
  }
}

function saveMySubmission(name, status) {
  localStorage.setItem(PERSONAL_KEY, JSON.stringify({ week: WEEK.key, name, status }));
}

function renderForm(availableNames) {
  const app = document.getElementById("app");
  if (availableNames.length === 0) {
    app.innerHTML = `<div class="card"><p class="empty">Alle namen zijn al gekozen. Neem contact op als jouw naam ontbreekt.</p></div>`;
    return;
  }
  const options = STATUS_OPTIONS.map(o =>
    `<label class="status-option" id="opt-${o.id}">
       <input type="radio" name="status" value="${o.id}" onchange="selectStatus('${o.id}')">
       <span class="dot ${o.dot}"></span>${o.label}
     </label>`
  ).join("");
  app.innerHTML = `
    <div class="card">
      <label for="nameSelect">Jouw naam</label>
      <select id="nameSelect" onchange="selectedName=this.value; document.getElementById('formError').textContent='';">
        <option value="">Kies een naam</option>
        ${availableNames.map(n => `<option value="${n}">${n}</option>`).join("")}
      </select>
      <label style="margin-top:16px;">Aanwezigheid</label>
      <div class="status-options">${options}</div>
      <div class="error" id="formError"></div>
      <button onclick="submitForm()">Versturen</button>
    </div>`;
}

function selectStatus(id) {
  selectedStatus = id;
  document.querySelectorAll(".status-option").forEach(el => el.classList.remove("selected"));
  document.getElementById(`opt-${id}`).classList.add("selected");
  document.getElementById("formError").textContent = "";
}

async function submitForm() {
  const nameSelect = document.getElementById("nameSelect");
  const errorEl = document.getElementById("formError");
  selectedName = nameSelect.value;
  if (!selectedName) {
    errorEl.textContent = "Kies eerst je naam.";
    return;
  }
  if (!selectedStatus) {
    errorEl.textContent = "Kies een aanwezigheidsoptie.";
    return;
  }
  const current = await loadSharedSignups();
  if (current[selectedName]) {
    errorEl.textContent = "Deze naam is net door iemand anders gekozen. Kies een andere naam.";
    await init();
    return;
  }
  current[selectedName] = { status: selectedStatus, ts: Date.now() };
  await saveSharedSignups(current);
  saveMySubmission(selectedName, selectedStatus);
  mySubmission = { name: selectedName, status: selectedStatus };
  renderConfirmation();
  refreshOverview();
}

function renderConfirmation() {
  const statusLabel = STATUS_OPTIONS.find(o => o.id === mySubmission.status).label;
  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="confirm"><i class="ti ti-check"></i>
        <span><strong>${mySubmission.name}</strong> staat genoteerd als <strong>${statusLabel}</strong>.</span>
      </div>
      ${PAST_DEADLINE ? "" : `<button class="secondary" style="border:1px solid var(--border-strong); color:inherit;" onclick="changeAnswer()">Antwoord wijzigen</button>`}
    </div>`;
}

async function changeAnswer() {
  if (PAST_DEADLINE) return;
  const current = await loadSharedSignups();
  if (mySubmission && current[mySubmission.name]) {
    delete current[mySubmission.name];
    await saveSharedSignups(current);
  }
  mySubmission = null;
  selectedName = null;
  selectedStatus = null;
  localStorage.removeItem(PERSONAL_KEY);
  await init();
  refreshOverview();
}

async function autoFillAbsent() {
  const current = await loadSharedSignups();
  const taken = Object.keys(current);
  const missing = ALL_NAMES.filter(n => !taken.includes(n));
  if (missing.length === 0) return;
  missing.forEach(n => {
    current[n] = { status: "away", ts: Date.now(), auto: true };
  });
  await saveSharedSignups(current);
}

function renderLocked() {
  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="confirm" style="background: var(--danger-bg); color: var(--danger);">
        <i class="ti ti-lock"></i>
        <span>De deadline is verstreken, invullen kan niet meer.</span>
      </div>
    </div>`;
}

async function refreshOverview() {
  const data = await loadSharedSignups();
  const overview = document.getElementById("overview");
  const count = document.getElementById("responseCount");
  const entries = Object.entries(data);
  count.textContent = `${entries.length} van ${ALL_NAMES.length} ingevuld`;
  if (entries.length === 0) {
    overview.innerHTML = `<p class="empty">Nog niemand heeft ingevuld.</p>`;
    return;
  }
  overview.innerHTML = STATUS_OPTIONS.map(opt => {
    const names = entries.filter(([, v]) => v.status === opt.id).map(([n]) => n);
    if (names.length === 0) return "";
    return `<div class="group">
      <div class="group-title"><span class="dot ${opt.dot}"></span>${opt.label} (${names.length})</div>
      ${names.map(n => `<span class="name-pill">${n}</span>`).join("")}
    </div>`;
  }).join("");
}

async function init() {
  if (PAST_DEADLINE) {
    await autoFillAbsent();
    mySubmission = loadMySubmission();
    if (mySubmission) {
      renderConfirmation();
    } else {
      renderLocked();
    }
    return;
  }
  mySubmission = loadMySubmission();
  if (mySubmission) {
    const shared = await loadSharedSignups();
    if (shared[mySubmission.name]) {
      renderConfirmation();
      return;
    }
    mySubmission = null;
  }
  const shared = await loadSharedSignups();
  const taken = Object.keys(shared);
  const available = ALL_NAMES.filter(n => !taken.includes(n));
  renderForm(available);
}

// --- Beheer (admin) ---

function openAdminPin() {
  enteredPin = "";
  updatePinDots();
  document.getElementById("pinError").textContent = "";
  document.getElementById("adminPinOverlay").classList.remove("hidden");
}
function closeAdminPin() {
  document.getElementById("adminPinOverlay").classList.add("hidden");
}
function updatePinDots() {
  const dots = document.querySelectorAll("#pinDots .pin-dot");
  dots.forEach((dot, i) => dot.classList.toggle("filled", i < enteredPin.length));
}
function pinPress(digit) {
  if (enteredPin.length >= 4) return;
  enteredPin += digit;
  updatePinDots();
  if (enteredPin.length === 4) {
    if (enteredPin === ADMIN_PIN) {
      closeAdminPin();
      openAdminPanel();
    } else {
      document.getElementById("pinError").textContent = "Onjuiste code.";
      enteredPin = "";
      setTimeout(updatePinDots, 150);
    }
  }
}
function pinBackspace() {
  enteredPin = enteredPin.slice(0, -1);
  updatePinDots();
}

function openAdminPanel() {
  pendingNames = ALL_NAMES.slice();
  renderAdminNames();
  populateWeekdaySelect("deadlineWeekdaySelect", CONFIG.deadlineWeekday);
  populateHourSelect("deadlineHourSelect", CONFIG.deadlineHour);
  populateWeekdaySelect("resetWeekdaySelect", CONFIG.resetWeekday);
  populateHourSelect("resetHourSelect", CONFIG.resetHour);
  document.getElementById("adminPanelOverlay").classList.remove("hidden");
}
function closeAdminPanel() {
  document.getElementById("adminPanelOverlay").classList.add("hidden");
}

function renderAdminNames() {
  const list = document.getElementById("adminNamesList");
  list.innerHTML = pendingNames.slice().sort((a, b) => a.localeCompare(b, "nl")).map(n =>
    `<div class="admin-name-row"><span>${n}</span><button onclick="removeName('${n.replace(/'/g, "\\'")}')">Verwijder</button></div>`
  ).join("");
}
function addName() {
  const input = document.getElementById("newNameInput");
  const name = input.value.trim();
  if (!name) return;
  if (pendingNames.some(n => n.toLowerCase() === name.toLowerCase())) {
    input.value = "";
    return;
  }
  pendingNames.push(name);
  input.value = "";
  renderAdminNames();
}
function removeName(name) {
  pendingNames = pendingNames.filter(n => n !== name);
  renderAdminNames();
}

function populateWeekdaySelect(id, selected) {
  const el = document.getElementById(id);
  el.innerHTML = WEEKDAY_FULL.map((w, i) => `<option value="${i}" ${i === selected ? "selected" : ""}>${w}</option>`).join("");
}
function populateHourSelect(id, selected) {
  const el = document.getElementById(id);
  let html = "";
  for (let h = 0; h < 24; h++) {
    html += `<option value="${h}" ${h === selected ? "selected" : ""}>${String(h).padStart(2, "0")}:00</option>`;
  }
  el.innerHTML = html;
}

async function saveAdminSettings() {
  if (pendingNames.length === 0) {
    alert("Er moet minstens één naam in de lijst staan.");
    return;
  }
  const newConfig = {
    deadlineWeekday: parseInt(document.getElementById("deadlineWeekdaySelect").value, 10),
    deadlineHour: parseInt(document.getElementById("deadlineHourSelect").value, 10),
    resetWeekday: parseInt(document.getElementById("resetWeekdaySelect").value, 10),
    resetHour: parseInt(document.getElementById("resetHourSelect").value, 10),
    names: pendingNames
  };
  await saveConfig(newConfig);
  location.reload();
}

async function resetCurrentWeek() {
  if (!confirm("Weet je zeker dat je de lijst van deze week wilt wissen?")) return;
  await db.ref(`signups/${WEEK.key}`).remove();
  localStorage.removeItem(PERSONAL_KEY);
  location.reload();
}

// --- Opstarten ---

async function mainInit() {
  CONFIG = await loadConfig();
  ALL_NAMES = CONFIG.names.slice().sort((a, b) => a.localeCompare(b, "nl"));
  WEEK = computeCycle(CONFIG);
  PAST_DEADLINE = WEEK.pastDeadline;

  document.getElementById("deadlineBox").innerHTML = PAST_DEADLINE
    ? `<i class="ti ti-lock"></i><span>Deadline (${fmtMoment(WEEK.deadlineDate, CONFIG.deadlineWeekday, CONFIG.deadlineHour)}) is verstreken. Wie niet heeft ingevuld staat op afwezig. De lijst reset ${fmtMoment(WEEK.resetDate, CONFIG.resetWeekday, CONFIG.resetHour)}.</span>`
    : `<i class="ti ti-clock"></i><span>Deadline invullen: <strong>${fmtMoment(WEEK.deadlineDate, CONFIG.deadlineWeekday, CONFIG.deadlineHour)}</strong></span>`;

  await init();
  await refreshOverview();
}

mainInit();
</script>
